name: validate-plugins
on:
  pull_request:
    paths: ['plugins/**', 'tools/**']
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Validate plugins
        run: python3 tools/validate.py
  build-index:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Rebuild index.json
        run: python3 tools/validate.py --build-index
      - name: Commit index.json if changed
        run: |
          if ! git diff --quiet index.json 2>/dev/null; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add index.json
            git commit -m 'ci: rebuild plugin index'
            git push
          else
            echo 'index.json unchanged'
          fi
